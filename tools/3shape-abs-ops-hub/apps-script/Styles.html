<style>
    :root{--navy:#0b1f3a;--navy2:#12345b;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#667085;--line:#e4e9f2;--green:#11845b;--red:#c9362b;--amber:#b66a00;--purple:#6d4aff;--shadow:0 10px 30px rgba(13,31,58,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Aptos,Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--navy),#07152a);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.12)}.brandmark{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800}.brand h1{font-size:15px;margin:0}.brand small{opacity:.7}.nav{display:grid;gap:6px;margin-top:18px}.nav button{border:0;background:transparent;color:#dbe7f5;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 0}
    .main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 24px;position:sticky;top:0;z-index:10}.title h2{margin:0;font-size:19px}.title small{color:var(--muted)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,.select{border:1px solid #cfd7e6;border-radius:9px;padding:9px 11px;background:#fff}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#edf3ff;color:#194eaa}.btn.dark{background:var(--navy);color:#fff}.btn.danger{background:#fde8e7;color:#9e271f}.btn:disabled{opacity:.55;cursor:not-allowed}.content{padding:22px;max-width:1600px;margin:auto}.view{display:none}.view.active{display:block}
    .banner{background:linear-gradient(120deg,var(--navy),#194f85);border-radius:16px;padding:20px;color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:var(--shadow);margin-bottom:18px}.banner h3{margin:0 0 5px;font-size:20px}.banner p{margin:0;opacity:.8}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#edf3ff;color:#194eaa}.pill.green{background:#e6f7f0;color:#0c6848}.pill.red{background:#fdebea;color:#a12b23}.pill.amber{background:#fff3da;color:#915400}.pill.gray{background:#eff2f6;color:#475467}
    .kpis{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(13,31,58,.04)}.kpi .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.kpi .value{font-size:28px;font-weight:800;margin-top:6px}.kpi .sub{color:var(--muted);font-size:12px;margin-top:4px}
    .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(13,31,58,.04);overflow:hidden}.cardhead{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);gap:12px}.cardhead h3{margin:0;font-size:15px}.cardbody{padding:16px}.tablewrap{overflow:auto;max-height:620px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{position:sticky;top:0;background:#f8fafc;color:#475467;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:10px;white-space:nowrap;z-index:1}.table td{border-bottom:1px solid #edf0f5;padding:10px;vertical-align:top}.table tr:hover td{background:#fafcff}.link{color:#185abc;text-decoration:none;max-width:260px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.right{text-align:right}.center{text-align:center}
    .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#475467}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd7e6;border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.helper{font-size:12px;color:var(--muted)}.drop{border:1.5px dashed #a8b7cc;border-radius:12px;padding:16px;text-align:center;background:#f8fbff}.notice{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}.notice.info{background:#eef4ff;color:#234f9c}.notice.success{background:#eaf8f1;color:#116443}.notice.error{background:#fdebea;color:#992f27}.notice.warn{background:#fff6df;color:#805000}.loading{opacity:.6;pointer-events:none}.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#a4acb9}.statusdot.ok{background:#1a9b67}.sectiontitle{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 0 14px}.sectiontitle h3{margin:0}.sectiontitle p{margin:4px 0 0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:35px;text-align:center;color:var(--muted)}
    .progress{height:8px;background:#e8eef7;border-radius:99px;overflow:hidden}.progress>span{height:100%;display:block;background:var(--blue)}.metricrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0}.metricrow small{color:var(--muted)}
    .modalback{display:none;position:fixed;inset:0;background:rgba(5,16,32,.55);z-index:50;align-items:center;justify-content:center;padding:20px}.modalback.show{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:15px;box-shadow:0 25px 80px rgba(0,0,0,.25);overflow:hidden}.modalhead{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:800}.modalbody{padding:18px}.modalfoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{grid-template-columns:repeat(2,1fr)}.topbar{height:auto;position:relative;align-items:flex-start;gap:12px;flex-direction:column}.content{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
