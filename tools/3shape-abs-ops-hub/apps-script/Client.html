<script>
const state={bootstrap:null,productivity:null,hourly:null,clearPath:null,currentView:'dashboard',reasonRow:null};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function server(fn,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))[fn](...args);});}
function setLoading(on){$('app').classList.toggle('loading',on)}
function msg(id,text,type='info'){ $(id).innerHTML=text?`<div class="notice ${type}">${esc(text)}</div>`:''; }
function fmtPct(n){return `${Number(n||0).toFixed(2)}%`} function num(n){return Number(n||0).toLocaleString()}
function badge(text){const t=String(text||'');let c='gray';if(t.includes('PASS')||t.includes('BALANCED')||t==='MET'||t==='Completed')c='green';else if(t.includes('ACTION')||t.includes('NOT MET')||t.includes('PENDING')||t.includes('CHECK'))c='red';else if(t.includes('Escalated')||t.includes('PRORATED'))c='amber';return `<span class="pill ${c}">${esc(t)}</span>`}
function linkCell(url,label='Open'){return url?`<a class="link" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`:'—'}

async function init(){
  document.querySelectorAll('#nav button[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
  $('reloadBtn').onclick=loadAll; $('saveScrapeBtn').onclick=saveScrape; $('saveAbsBtn').onclick=saveAbs; $('saveClearpathBtn').onclick=saveClearPath;
  $('pdfFile').addEventListener('change',detectPatientFromPdf); $('scrapeLink').addEventListener('input',()=>{if(!$('scrapePatient').value) $('scrapePatient').value=patientFromLink($('scrapeLink').value)});
  const now=new Date(); const local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10); $('shiftDate').value=local; $('shiftDate').onchange=loadAll;
  $('histTo').value=local; const d=new Date(); d.setDate(d.getDate()-30); $('histFrom').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  await loadAll();
}
async function loadAll(){
  setLoading(true);try{const data=await server('getBootstrap',$('shiftDate').value);state.bootstrap=data;state.productivity=data.productivity;state.hourly=data.hourly;state.clearPath=data.clearPath;$('shiftDate').value=data.shiftDate;$('coverageText').textContent=data.shiftCoverage;$('serverTime').textContent='Live · '+data.serverTime;$('liveDot').classList.add('ok');populateNinjas(data.ninjas);renderDashboard();renderProductivity();renderHourly();renderClearPath();if(state.currentView==='reconciliation')await loadReconciliation();if(state.currentView==='pending')await loadPending();if(state.currentView==='unmatched')await loadUnmatched();if(state.currentView==='quality')await loadQuality();}catch(e){alert(e.message);$('serverTime').textContent='Connection error'}finally{setLoading(false)}}
function populateNinjas(ninjas){['scrapeNinja','absNinja'].forEach(id=>{$(id).innerHTML=ninjas.map(n=>`<option>${esc(n)}</option>`).join('')});$('prodNinjaFilter').innerHTML='<option value="ALL">All Ninjas</option>'+ninjas.map(n=>`<option>${esc(n)}</option>`).join('')}
function showView(name){state.currentView=name;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('view-'+name).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));const titles={dashboard:'Operations Dashboard',scrape:'Scrape Intake',abs:'ABS Processing',reconciliation:'Reconciliation',pending:'Pending Queue',unmatched:'Unmatched ABS',clearpath:'ClearPath Queue Control',productivity:'Shift Productivity',hourly:'Hourly Activity',history:'Historical View',quality:'Data Quality'};$('pageTitle').textContent=titles[name]||'Operations Hub';if(name==='reconciliation')loadReconciliation();if(name==='pending')loadPending();if(name==='unmatched')loadUnmatched();if(name==='history')loadHistory();if(name==='quality')loadQuality()}

function renderDashboard(){const d=state.bootstrap.dashboard;$('dashboardCoverage').textContent=d.coverage;$('eodBadge').className='pill '+(d.eodResult==='PASS'?'green':'red');$('eodBadge').textContent=d.eodResult;const k=[['Total Scraped',d.totalScraped,'Selected scrape cohort'],['Completed',d.completed,'Completed in ABS'],['Escalated',d.escalated,'Escalated in ABS'],['Pending',d.pending,'No ABS update'],['Reconciled',d.reconciled,fmtPct(d.reconciliationRate)],['Data Quality',d.dataQualityIssues,d.dataQualityIssues?'Review required':'No detected issues']];$('kpiGrid').innerHTML=k.map(x=>`<div class="kpi"><div class="label">${esc(x[0])}</div><div class="value">${num(x[1])}</div><div class="sub">${esc(x[2])}</div></div>`).join('');$('ninjaOutcomeBody').innerHTML=d.ninjaTotals.map(r=>`<tr><td>${esc(r.ninja)}</td><td class="right">${r.completed}</td><td class="right">${r.escalated}</td><td class="right"><strong>${r.total}</strong></td></tr>`).join('');$('carryoverBox').innerHTML=d.carryover.length?d.carryover.map(r=>`<div class="metricrow"><span>${esc(r.sourceShiftDate)}</span><strong>${num(r.pending)} pending</strong></div>`).join(''):'<div class="empty">No older pending cohorts detected.</div>';$('recentBody').innerHTML=d.recent.map(r=>`<tr><td class="mono">${esc(r.trackerId)}</td><td>${esc(r.patientName)}</td><td>${esc(r.scrapedBy)}</td><td>${badge(r.absDisposition)}</td><td>${esc(r.processedBy||'—')}</td><td>${badge(r.reconciliationStatus)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No cases for this shift.</td></tr>'}

async function loadReconciliation(){try{setLoading(true);const rows=await server('getReconciliation',$('shiftDate').value,$('reconFilter').value,2000);$('reconBody').innerHTML=rows.map(r=>`<tr><td class="mono">${esc(r.trackerId)}</td><td>${esc(r.patientName)}</td><td>${esc(r.scrapeTimestamp)}</td><td>${esc(r.scrapedBy)}</td><td>${badge(r.absDisposition)}</td><td class="mono">${esc(r.absCaseId||'—')}</td><td>${esc(r.processedBy||'—')}</td><td>${badge(r.reconciliationStatus)}</td><td>${esc(r.eodAction||'—')}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No matching rows.</td></tr>'}catch(e){alert(e.message)}finally{setLoading(false)}}
async function loadPending(){try{setLoading(true);const rows=await server('getPending',$('shiftDate').value,3000);$('pendingBody').innerHTML=rows.map(r=>`<tr><td class="mono">${esc(r.trackerId)}</td><td>${esc(r.patientName)}</td><td>${esc(r.scrapedBy)}</td><td>${Number(r.ageHours||0).toFixed(1)}</td><td>${linkCell(r.sourceLink,'Open source')}</td><td>${esc(r.eodAction||'Check ClearPath / assigned Ninja')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No pending cases for this shift.</td></tr>'}catch(e){alert(e.message)}finally{setLoading(false)}}
async function loadUnmatched(){try{setLoading(true);const rows=await server('getUnmatched',$('shiftDate').value,2000);renderObjectTable('unmatchedTable',rows)}catch(e){alert(e.message)}finally{setLoading(false)}}
function renderObjectTable(id,rows){const t=$(id);if(!rows.length){t.innerHTML='<tbody><tr><td class="empty">No records.</td></tr></tbody>';return}const headers=Object.keys(rows[0]);t.innerHTML='<thead><tr>'+headers.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+headers.map(h=>`<td>${esc(r[h]??'')}</td>`).join('')+'</tr>').join('')+'</tbody>'}

function renderClearPath(){const c=state.clearPath;if(!c)return;$('cpOpening').value=c.openingQueue;$('cpClosing').value=c.closingQueue;$('cpOther').value=c.otherUploads;const k=[['Opening Queue',c.openingQueue,'Manual'],['Our Uploads',c.uploaded,'Auto'],['Ninja Processed',c.ninjaProcessed,'Matched cohort'],['Client / Other',c.clientOtherProcessed,fmtPct(c.clientOtherShare)],['Closing Queue',c.closingQueue,'Manual'],['Difference',c.difference,c.status]];$('clearpathKpis').innerHTML=k.map(x=>`<div class="kpi"><div class="label">${esc(x[0])}</div><div class="value">${num(x[1])}</div><div class="sub">${esc(x[2])}</div></div>`).join('');$('cpStatus').className='pill '+(c.status==='BALANCED'?'green':'red');$('cpStatus').textContent=c.status;$('clearpathEquation').innerHTML=`<div class="metricrow"><span>Opening queue</span><strong>${num(c.openingQueue)}</strong></div><div class="metricrow"><span>+ Our uploads</span><strong>${num(c.uploaded)}</strong></div><div class="metricrow"><span>+ Other uploads</span><strong>${num(c.otherUploads)}</strong></div><hr style="border:0;border-top:1px solid #e4e9f2"><div class="metricrow"><span>Total available</span><strong>${num(c.totalAvailable)}</strong></div><br><div class="metricrow"><span>Ninja completed</span><strong>${num(c.ninjaCompleted)}</strong></div><div class="metricrow"><span>+ Ninja escalated</span><strong>${num(c.ninjaEscalated)}</strong></div><div class="metricrow"><span>+ Client / other processed</span><strong>${num(c.clientOtherProcessed)}</strong></div><div class="metricrow"><span>+ Closing queue</span><strong>${num(c.closingQueue)}</strong></div><hr style="border:0;border-top:1px solid #e4e9f2"><div class="metricrow"><span>Difference</span><strong>${num(c.difference)}</strong></div>`}
async function saveClearPath(){try{msg('clearpathMessage','Saving…','info');state.clearPath=await server('saveClearPathInputs',{shiftDate:$('shiftDate').value,openingQueue:$('cpOpening').value,closingQueue:$('cpClosing').value,otherUploads:$('cpOther').value});renderClearPath();msg('clearpathMessage','ClearPath queue inputs saved for this Shift Date.','success')}catch(e){msg('clearpathMessage',e.message,'error')}}

function renderProductivity(){const p=state.productivity;if(!p)return;const f=$('prodNinjaFilter').value||'ALL';const sums=f==='ALL'?p.summary:p.summary.filter(r=>r.ninja===f);$('prodSummaryBody').innerHTML=sums.map(r=>`<tr><td>${esc(r.ninja)}</td><td class="right">${r.target}</td><td class="right">${r.completed}</td><td class="right">${r.escalated}</td><td class="right"><strong>${r.actual}</strong></td><td class="right">${fmtPct(r.attainment)}</td></tr>`).join('');const rows=f==='ALL'?p.rows:p.rows.filter(r=>r.ninja===f);$('prodRowsBody').innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.ninja)}</td><td>${esc(r.interval)}</td><td>${badge(r.activity)}</td><td class="right">${r.target}</td><td class="right">${r.completed}</td><td class="right">${r.escalated}</td><td class="right"><strong>${r.actual}</strong></td><td>${badge(r.status)}</td><td>${esc(r.adjustmentReason)}</td><td>${r.status==='NOT MET'?`<button class="btn secondary" onclick='openReasonModal(${JSON.stringify(r).replace(/'/g,"&#39;")})'>${r.missReason?esc(r.missReason):'Add reason'}</button>`:esc(r.missReason||'—')}</td></tr>`).join('')}
function openReasonModal(r){state.reasonRow=r;$('reasonContext').textContent=`${r.ninja} · ${r.interval} · Target ${r.target} / Actual ${r.actual}`;$('reasonText').value=r.missReason||'';$('reasonModal').classList.add('show')}
function closeReasonModal(){$('reasonModal').classList.remove('show');state.reasonRow=null}
async function saveReason(){if(!state.reasonRow)return;try{await server('saveProductivityReason',{shiftDate:$('shiftDate').value,ninja:state.reasonRow.ninja,interval:state.reasonRow.interval,reason:$('reasonText').value});closeReasonModal();state.productivity=await server('getProductivity',$('shiftDate').value);renderProductivity()}catch(e){alert(e.message)}}

function renderHourly(){const h=state.hourly;if(!h)return;$('hourTotalsBody').innerHTML=h.totals.map(r=>`<tr><td>${esc(r.ninja)}</td><td class="right">${r.scraped}</td><td class="right">${r.completed}</td><td class="right">${r.escalated}</td><td class="right"><strong>${r.total}</strong></td></tr>`).join('');$('hourSelect').innerHTML=h.intervals.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join('');renderHourlyInterval()}
function renderHourlyInterval(){const h=state.hourly;if(!h)return;const idx=Number($('hourSelect').value||0);const x=h.intervals[idx];if(!x)return;$('hourCardTitle').textContent=x.label;$('hourIntervalBody').innerHTML=x.ninjas.map(r=>`<tr><td>${esc(r.ninja)}</td><td class="right">${r.scraped}</td><td class="right">${r.completed}</td><td class="right">${r.escalated}</td><td class="right"><strong>${r.total}</strong></td></tr>`).join('')}

async function loadHistory(){try{setLoading(true);const rows=await server('getHistory',$('histFrom').value,$('histTo').value);$('historyBody').innerHTML=rows.map(r=>`<tr><td>${esc(r.shiftDate)}</td><td class="right">${r.scraped}</td><td class="right">${r.completed}</td><td class="right">${r.escalated}</td><td class="right">${r.pending}</td><td class="right">${r.reconciled}</td><td class="right">${fmtPct(r.reconciliationRate)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No historical rows.</td></tr>'}catch(e){alert(e.message)}finally{setLoading(false)}}
async function loadQuality(){try{setLoading(true);const rows=await server('getReconciliation',$('shiftDate').value,'ISSUES',3000);$('qualityBody').innerHTML=rows.flatMap(r=>r.qualityIssues.map(q=>`<tr><td class="mono">${esc(r.trackerId)}</td><td>${esc(r.patientName)}</td><td>${badge(r.absDisposition)}</td><td>${esc(r.processedBy||'—')}</td><td>${badge(q)}</td><td>${esc(q.includes('CASE ID')?'Add/verify ABS Case ID':q.includes('ESCALATION')?'Add escalation reason':'Investigate exception')}</td></tr>`)).join('')||'<tr><td colspan="6" class="empty">No detected data-quality issues.</td></tr>'}catch(e){alert(e.message)}finally{setLoading(false)}}

async function saveScrape(){try{msg('scrapeMessage','Saving…','info');await server('addScrape',{patientName:$('scrapePatient').value,sourceLink:$('scrapeLink').value,scrapedBy:$('scrapeNinja').value,uploadStatus:$('uploadStatus').value});msg('scrapeMessage','Saved to Scrape Log. Tracker formulas and reconciliation will populate from the existing workbook logic.','success');$('scrapePatient').value='';$('scrapeLink').value='';$('pdfFile').value='';await loadAll()}catch(e){msg('scrapeMessage',e.message,'error')}}
async function saveAbs(){try{msg('absMessage','Saving…','info');await server('addAbsOutcome',{pdfLink:$('absLink').value,processedBy:$('absNinja').value,disposition:$('absDisposition').value,absCaseId:$('absCaseId').value,escalationReason:$('absEscalation').value,notes:$('absNotes').value});msg('absMessage','ABS Outcome saved. Reconciliation has been refreshed.','success');$('absLink').value='';$('absCaseId').value='';$('absEscalation').value='';$('absNotes').value='';await loadAll()}catch(e){msg('absMessage',e.message,'error')}}

function patientFromLink(raw){try{const u=decodeURIComponent(String(raw||''));let f='';const id=u.match(/[?&]id=([^&]+)/i);if(id)f=decodeURIComponent(id[1]).split('/').pop();if(!f)f=u.split(/[\\/]/).pop().split(/[?#]/)[0];f=f.replace(/\.pdf$/i,'').replace(/\s*\(\d+\)\s*$/,'').replace(/[_-]+/g,' ').trim();return f.length>2&&f.length<90?f:''}catch(e){return ''}}
async function detectPatientFromPdf(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;msg('scrapeMessage','Reading PDF locally for patient-name detection…','info');try{let detected='';try{const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs';const data=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjs.getDocument({data}).promise;let text='';for(let p=1;p<=Math.min(pdf.numPages,2);p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();text+=' '+tc.items.map(i=>i.str).join(' ')}const patterns=[/patient\s*name\s*[:\-]?\s*([A-Za-z][A-Za-z .,'\-]{2,70}?)(?=\s{2,}|doctor|dentist|tooth|shade|material|$)/i,/patient\s*[:\-]\s*([A-Za-z][A-Za-z .,'\-]{2,70}?)(?=\s{2,}|doctor|tooth|$)/i];for(const re of patterns){const m=text.match(re);if(m){detected=m[1].trim();break}}}catch(e){}
      if(!detected)detected=file.name.replace(/\.pdf$/i,'').replace(/\s*\(\d+\)\s*$/,'').replace(/[_-]+/g,' ').trim();$('scrapePatient').value=detected;msg('scrapeMessage','Patient-name suggestion detected. Please verify it against the PDF before saving.','success')
    }catch(e){msg('scrapeMessage','Could not detect the patient name automatically. Enter it manually.','warn')}}

document.addEventListener('DOMContentLoaded',init);
</script>
